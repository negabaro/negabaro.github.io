<body class="nb-layout">

  <!-- Top Navigation -->
  <nav class="nb-nav">
    <a class="nb-nav-brand" href="/">Negabaro`s Blog</a>
    <ul class="nb-nav-links">
      <li><a href="/archive/">Archive</a></li>
      <li><a href="/category/">Category</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/search/"><i class="fa fa-search"></i></a></li>
      <li><a class="nb-nav-cta" href="https://www.negabaro.com/ko/contact?utm_source=negabaro.github.io&utm_medium=referral&utm_campaign=blog_nav" target="_blank" rel="noopener">문의하기</a></li>
    </ul>
  </nav>

  <div class="nb-wrapper">
    <!-- Left Sidebar -->
<aside class="nb-sidebar" id="nb-sidebar">
  <div class="nb-sidebar-header">
    <h3>Categories</h3>
  </div>

  <div class="nb-sidebar-search">
    <input type="text" id="nb-sidebar-filter" placeholder="Filter categories...">
  </div>

  <div id="nb-sidebar-tree"></div>
</aside>

<!-- Mobile overlay -->
<div class="nb-sidebar-overlay" id="nb-sidebar-overlay" onclick="closeSidebar()"></div>

<!-- Mobile toggle -->
<button class="nb-sidebar-toggle" id="nb-sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
  &#9776;
</button>

<!-- Category tree: 폴더 경로 기반 (_data/categories.yml, js/nb-categories.js) -->
<script src="/js/nb-categories.js"></script>
<script>
NbCategories.renderSidebar(document.getElementById('nb-sidebar-tree'), "/search/");

function toggleSidebar() {
  document.getElementById('nb-sidebar').classList.toggle('mobile-open');
  document.getElementById('nb-sidebar-overlay').classList.toggle('active');
}

function closeSidebar() {
  document.getElementById('nb-sidebar').classList.remove('mobile-open');
  document.getElementById('nb-sidebar-overlay').classList.remove('active');
}
</script>


    <main class="nb-main">
      <!-- Page Header -->
<header class="nb-article-header">
  <div class="nb-breadcrumb">
    <a href="/">Home</a>
    <span class="nb-sep">/</span>
    <span>Search</span>
  </div>
  <h1>Search</h1>
  
    <p style="font-size: 1.125rem; color: var(--gray-500); margin: 0;">What are you looking for?</p>
  
</header>

<!-- Main Content -->
<div class="nb-article-body">
  <!-- Html Elements for Search -->
<input type="text" id="search-input" placeholder="Enter keywords..." class="form-control input-lg">
<br>
<br>
<ul id="results-container" ></ul>    

<!-- Script pointing to jekyll-search.js -->
<script src="//js/jekyll-search.js" type="text/javascript"></script>

    <script type="text/javascript">
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        json: '//search.json',
        searchResultTemplate: '<div class="post-preview"><a href="{url}"><h3 class="post-subtitle">{title}</h3></a><p class="post-meta">{date}  <i class="fa fa-tag"></i> {tags}</p></div><hr>',
        noResultsText: 'No results found',
        limit: 20,
        fuzzy: true,
        exclude: ['Welcome', 'Blog']
      })
    </script>


  <!-- _includes/utterances-comment.html -->


<script src="https://utteranc.es/client.js"
        repo="negabaro/blog-comments"
        issue-term="title"
        theme="github-light"
        label="/search/"  # you can going to https://jekyllrb.com/docs/variables/#page-variables find more page variables as a label.
        crossorigin="anonymous"
        async>
</script>


  
</div>
